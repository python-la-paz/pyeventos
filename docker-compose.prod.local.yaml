version: '3.9' 
services:
  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  app:
    image: pythonlapaz/pyeventos:latest
    restart: always
    expose:
      - "8000"
    env_file:
      - backend/.env